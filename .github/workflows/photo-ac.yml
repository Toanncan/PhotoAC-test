name: Photo-AC Tests

on:
  push:
    branches: [dev]
    paths:
      - 'photo-ac/**'
      - 'package.json'
      - '.github/workflows/photo-ac.yml'
  pull_request:
    branches: [dev, master]
    paths:
      - 'photo-ac/**'
      - 'package.json'
      - '.github/workflows/photo-ac.yml'

  # Cho phép trigger thủ công
  workflow_dispatch:

permissions:
  contents: write
  actions: write # Cho phép dọn dẹp workflow runs cũ

jobs:
  test:
    name: Run Photo-AC Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ENV_NAME: ${{ secrets.ENV_NAME }}
      BASE_URL: ${{ secrets.PHOTO_BASE_URL || secrets.BASE_URL }}
      PREMIUM_USER_EMAIL: ${{ secrets.PREMIUM_USER_EMAIL || secrets.TEST_USER_EMAIL }}
      PREMIUM_USER_PASSWORD: ${{ secrets.PREMIUM_USER_PASSWORD || secrets.TEST_USER_PASSWORD }}
      FREE_USER_EMAIL: ${{ secrets.FREE_USER_EMAIL }}
      FREE_USER_PASSWORD: ${{ secrets.FREE_USER_PASSWORD }}
      CREATOR_EMAIL: ${{ secrets.CREATOR_EMAIL }}
      CREATOR_PASSWORD: ${{ secrets.CREATOR_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      HTTP_USER: ${{ secrets.HTTP_USER }}
      HTTP_PASS: ${{ secrets.HTTP_PASS }}
      # Gmail API credentials (base64 encoded)
      GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
      GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
      ENV: staging
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      # Setup Gmail API credentials (decode from base64 secrets)
      - name: Setup Gmail API credentials
        if: env.GMAIL_CREDENTIALS != ''
        run: |
          echo "$GMAIL_CREDENTIALS" | base64 -d > credentials.json
          echo "$GMAIL_TOKEN" | base64 -d > gmail-token.json
          cp credentials.json photo-ac/ 2>/dev/null || true
          cp gmail-token.json photo-ac/ 2>/dev/null || true
          echo "Gmail API credentials configured"

      # Clean old reports trước khi chạy
      - name: Clean old results
        run: npm run clean

      # Chạy Playwright tests trên Chromium cho Photo-AC
      - name: Run Playwright tests (Chromium only)
        run: npm run test:photo:chromium

      # Đồng bộ kết quả test và report từ photo-ac ra thư mục gốc
      - name: Consolidate test reports and results
        if: always()
        run: |
          mkdir -p allure-results playwright-report test-results
          if [ -d "photo-ac/allure-results" ]; then
            cp -rn photo-ac/allure-results/* allure-results/ 2>/dev/null || true
          fi
          if [ -d "photo-ac/playwright-report" ]; then
            cp -rn photo-ac/playwright-report/* playwright-report/ 2>/dev/null || true
          fi
          if [ -d "photo-ac/test-results" ]; then
            cp -rn photo-ac/test-results/* test-results/ 2>/dev/null || true
          fi

      # ── Allure Report ────────────────────────────────────────────────────────

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Setup Java (for Allure Report)
        uses: actions/setup-java@v4
        if: always()
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p allure-results/history
          if [ -d "gh-pages-dir/photo-ac/history" ]; then
            cp -r gh-pages-dir/photo-ac/history/* allure-results/history/ 2>/dev/null || true
          elif [ -d "gh-pages-dir/history" ]; then
            cp -r gh-pages-dir/history/* allure-results/history/ 2>/dev/null || true
          fi
          npx allure-commandline generate allure-results --clean -o allure-report
          cp -r allure-results/history allure-report/ 2>/dev/null || true

      # Chuẩn bị cấu trúc deploy cho GitHub Pages (tách thư mục photo-ac & Portal landing page)
      - name: Prepare GitHub Pages Deployment
        if: always()
        run: |
          mkdir -p gh-pages-deploy/photo-ac
          cp -r allure-report/* gh-pages-deploy/photo-ac/
          cat << 'EOF' > gh-pages-deploy/index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AC Works - Test Automation Reports</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f19; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
              .container { max-width: 600px; width: 90%; background: #1e293b; border-radius: 20px; padding: 40px; text-align: center; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
              h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
              p { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
              .cards { display: flex; flex-direction: column; gap: 16px; }
              .card { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-radius: 14px; text-decoration: none; color: #fff; font-weight: 600; font-size: 16px; transition: all 0.2s ease; border: 1px solid rgba(255, 255, 255, 0.08); }
              .photo-card { background: linear-gradient(135deg, #0284c7, #0369a1); }
              .illust-card { background: linear-gradient(135deg, #ea580c, #c2410c); }
              .card:hover { transform: translateY(-3px); filter: brightness(1.1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
              .badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>AC Works Test Reports</h1>
              <p>Hệ thống Báo cáo Kiểm thử Tự động Playwright E2E</p>
              <div class="cards">
                <a href="./photo-ac/" class="card photo-card">
                  <span>📸 Photo-AC Allure Report</span>
                  <span class="badge">Xem báo cáo →</span>
                </a>
                <a href="./illust-ac/" class="card illust-card">
                  <span>🎨 Illust-AC Allure Report</span>
                  <span class="badge">Xem báo cáo →</span>
                </a>
              </div>
            </div>
          </body>
          </html>
          EOF

      # Deploy lên branch gh-pages (giữ lại các file cũ bằng keep_files)
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-deploy
          keep_files: true

      # ── Upload Artifacts ──────────────────────────────────────────────────────

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-photo-ac-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-photo-ac-${{ github.run_number }}
          path: allure-results/
          retention-days: 30

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-photo-ac-${{ github.run_number }}
          path: allure-report/
          retention-days: 30

      - name: Upload Test Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-photo-ac-${{ github.run_number }}
          path: test-results/
          retention-days: 7

      # ── Tự động dọn dẹp các lần chạy cũ (giữ lại 5 runs gần nhất của Photo-AC) ──
      - name: Cleanup old workflow runs (keep latest 5)
        uses: Mattraks/delete-workflow-runs@v2
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5
          workflow_id: 'photo-ac.yml'
